<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>클래스 배틀그라운드</title>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--red:#ef4444;--blue:#2563eb;--green:#16a34a;--purple:#7c3aed;--yellow:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
  #app{max-width:1280px;margin:0 auto;padding:12px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(#facc15,#d97706);display:flex;align-items:center;justify-content:center;font-weight:900;color:#111827}
  .brand h1{font-size:20px;margin:0}
  .brand small{color:var(--muted);font-size:12px}
  .card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px;margin-bottom:12px}
  .card h2{font-size:17px;margin:0 0 10px}
  .card h3{font-size:14px;margin:12px 0 6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:8px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .gauto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  @media(min-width:900px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink);transition:transform .08s}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-red{background:var(--red);color:#fff;border-color:var(--red)}
  .btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green)}
  .btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
  .btn-dark{background:#111827;color:#fff;border-color:#111827}
  .btn-yellow{background:var(--yellow);color:#fff;border-color:var(--yellow)}
  .sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .lg{padding:14px 16px;font-size:17px;font-weight:700}
  .ex{text-align:left;display:flex;flex-direction:column;gap:2px}
  .ex .v{font-size:12px;color:var(--muted)}
  .ex.done{background:#dcfce7;border-color:#4ade80;color:#166534}
  .ex.done .v{color:#166534}
  .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;background:#f3f4f6}
  .b-red{background:#fee2e2;color:#991b1b}.b-blue{background:#dbeafe;color:#1e40af}.b-green{background:#dcfce7;color:#166534}.b-pur{background:#ede9fe;color:#5b21b6}
  input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}
  .muted{color:var(--muted);font-size:12px}
  .log{max-height:220px;overflow-y:auto;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}
  .log div{padding:2px 0}
  .team-card{text-align:center;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;position:relative}
  .team-card .nm{font-weight:800;margin-bottom:6px}
  .bar{font-size:12px;text-align:left;margin-top:4px}
  .bar .t{display:flex;justify-content:space-between}
  .bar .b{height:8px;background:#f3f4f6;border-radius:99px;overflow:hidden}
  .bar .b i{display:block;height:100%;background:var(--blue)}
  .pend{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center;animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .flash{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.9);color:#fff;padding:8px 14px;border-radius:99px;z-index:60;font-size:14px;animation:pop .2s ease}
  .qrbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
  .qr img,.qr canvas{display:block}
  .map{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
  .map .desk{padding:4px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px}
  .map .seats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
  .map .seat{padding:6px 14px;border-radius:8px;font-weight:700;font-size:13px}
  .info{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;margin-top:6px}
  .warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;font-size:13px}
  .center{text-align:center}
  .hp0{filter:grayscale(1);opacity:.6}
  details summary{cursor:pointer;font-weight:700}
  #err{position:fixed;left:10px;bottom:10px;background:#fee;color:#b00;border:1px solid #faa;border-radius:10px;padding:6px 10px;font:12px/1.4 monospace;display:none;z-index:99;max-width:90vw}
</style>
</head>
<body>
<div id="app"></div>
<div id="err"></div>
<script>
/* =====================================================================
   ① 설정 — 다른 선생님께 공유할 때는 이 블록만 바꾸면 됩니다.
   ===================================================================== */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDwt0Bw4HXGaCqbyJG7yXmyhOmW9RLrFJs",
    authDomain: "classbattle-66c0a.firebaseapp.com",
    databaseURL: "https://classbattle-66c0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "classbattle-66c0a",
    storageBucket: "classbattle-66c0a.firebasestorage.app",
    messagingSenderId: "968457686375",
    appId: "1:968457686375:web:fcc2e6b0575255f5f573c2"
  },
  sheetUrl: "https://script.google.com/macros/s/AKfycbxg6R4tAvtRMJPCFwjg3pbLxzMVs6D_32i6KZRAu9lNbIlNgQM6Ozt-6odwSouj6-IouQ/exec",            // 구글 시트 결과 저장용 GAS 웹앱 URL (비워두면 JSON 다운로드만)
  teacherPassword: "8748"  // 교사 모드 진입 비밀번호
};

/* =====================================================================
   ② 게임 규칙 (기존 규칙 그대로)
   ===================================================================== */
const STARTING_HP = 10;
const MIN_TEAMS = 2, MAX_TEAMS = 6;
const PRICES = { attack:10, hp:15, randombox:25 };
const SOLO = [
  { key:'pushups', label:'푸쉬업 8개', value:1 },
  { key:'jacks',   label:'점핑잭 15개', value:1 },
  { key:'plank',   label:'플랭크 30초', value:2 },
  { key:'leg',     label:'레그 레이즈 15개', value:2 },
  { key:'squat',   label:'스쿼트 15개', value:1 },
  { key:'mount',   label:'마운틴 클라이머 15개', value:1 },
  { key:'burpee',  label:'버피테스트 10개', value:2 },
];
const PAIR = [
  { key:'hi5',  label:'플랭크 하이파이브 15개 (2인)', value:2 },
  { key:'psqt', label:'파트너 스쿼트 10개 (2인)', value:2 },
  { key:'psit', label:'파트너 싯업 10개 (2인)', value:2 },
];
const MINIGAMES = ['홀짝게임(구슬)','지목 팔씨름','지목 발씨름','초 맞추기 게임','참참참','유연성 대결(가위바위보)','눈싸움','순발력 게임','눈감고 제자리 걸음(30초)'];
const BOX = {
  1:{ name:'LUCKY',        desc:'축하합니다! 공격권 3 + 방어권 2', apply:t=>{t.attack=(t.attack||0)+3;t.shield=(t.shield||0)+2;} },
  2:{ name:'GOOD',         desc:'공격권 2 + 방어권 1',             apply:t=>{t.attack=(t.attack||0)+2;t.shield=(t.shield||0)+1;} },
  3:{ name:'NOT BAD',      desc:'공격권 1 + 방어권 1',             apply:t=>{t.attack=(t.attack||0)+1;t.shield=(t.shield||0)+1;} },
  4:{ name:'AMAZING',      desc:'지목한 상대와 자원을 바꾸기',       apply:null },
  5:{ name:'UNBELIEVABLE', desc:'상대방 자원생산 3분간 정지',        apply:null },
  6:{ name:'HEAL',         desc:'HP +3 회복',                      apply:t=>{t.hp=(t.hp==null?STARTING_HP:t.hp)+3;} },
  7:{ name:'FAIL',         desc:'자신이 생산한 자원 -10',           apply:t=>{t.resource=Math.max(0,(t.resource||0)-10);} },
};
const FREEZE_MS = 3*60*1000;
const ATTACK_HP_DAMAGE = 2;     // 공격 성공 시 상대 HP -2 (자원은 그대로)
const ALLCLEAR_HP = 2;          // 모든 자원 채굴 보상 HP +2
const TEAM_COLORS = ['#2563eb','#ef4444','#16a34a','#eab308','#7c3aed','#f97316'];
const TEAM_BG = ['#dbeafe','#fee2e2','#dcfce7','#fef9c3','#ede9fe','#ffedd5'];
const HELP_SOLO = ['푸쉬업 — (남) 무릎 X, 팔 90° / (여) 무릎 O, 팔 90°','점핑잭 — 다리 벌렸다 모으기, 팔 펴기','플랭크 — 목·등·허리·엉덩이 일자, 두 발 붙임 (사이드/리버스 가능)','레그레이즈 — 누워서 손을 엉덩이 뒤, 다리 올리기(굽혀도 가능)','스쿼트 — 팔 앞으로, 하체 90° 이상','마운틴클라이머 — 엎드려 무릎을 가슴까지(양발 번갈아 1회)','버피테스트 — 앉기 → 다리 뒤로 → 다시 모아 일어서기'];
const HELP_PAIR = ['플랭크 하이파이브 — 플랭크하며 하이파이브','파트너 스쿼트 — 등 대고 동시에 앉고 일어나기','파트너 싯업 — 발 붙이고 일어나 손바닥 치기'];

/* =====================================================================
   ③ 앱
   ===================================================================== */
firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();
let authOK = false;
firebase.auth().signInAnonymously().then(()=>{ authOK=true; }).catch(e=>{
  showErr('Firebase 익명 로그인 실패. Authentication → 로그인 방법에서 "익명"이 사용 설정인지 확인하세요. ('+e.code+')');
});

const S = {
  role:null, code:null, pass:null, team:null, view:'home',
  meta:null, teams:{}, pending:{}, boxes:{}, logs:[], events:[], teamLogs:[],
  subs:[], flash:'',
  ui:{ controlTeam:1, swapA:1, swapB:2, freezeT:1, pendingFilter:'all', help:false, boxInfo:false, gameInfo:false,
       popupGame:null, popupTarget:null, rolls:{}, cooldown:{}, teacherModal:null,
       randomTeams:null, students:30, npc:6, className:'', newTeams:4, newPass:'', joinCode:'', joinPass:'', joinTeam:1,
       qrOpen:true, dismissedBox:null, saving:false }
};
const $ = s=>document.querySelector(s);
const tkey = i=>'t'+i;
const teamCount = ()=> (S.meta && S.meta.teamCount) || 4;
const teamIdx = ()=> Array.from({length:teamCount()},(_,i)=>i+1);
const T = i=> S.teams[tkey(i)] || {};
const now = ()=>Date.now();
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showErr(m){ const b=$('#err'); b.style.display='block'; b.textContent=m; }
function flash(m){ S.flash=m; render(); setTimeout(()=>{ if(S.flash===m){S.flash='';render();} },900); }
function roomRef(p){ return db.ref('rooms/'+S.code+(p?'/'+p:'')); }
function newTeam(){ return { hp:STARTING_HP, resource:0, attack:0, shield:0, attackSuccess:0, allClearCount:0, freezeUntil:0, solo:{}, pair:{} }; }
function genCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function baseUrl(){ return location.origin + location.pathname; }
function teamUrl(i){ return `${baseUrl()}?room=${S.code}&pass=${encodeURIComponent(S.pass)}&team=${i}`; }
function projUrl(){ return `${baseUrl()}?room=${S.code}&pass=${encodeURIComponent(S.pass)}&view=projector`; }
function frozen(i){ const u=T(i).freezeUntil||0; return u>now() ? Math.ceil((u-now())/1000) : 0; }
function fmt(ts){ const d=new Date(ts||now()); return d.toTimeString().slice(0,5); }

/* ---------- 쓰기 헬퍼 ---------- */
function log(text){ roomRef('logs').push({text, ts:firebase.database.ServerValue.TIMESTAMP}); }
function addEvent(text){ roomRef('events').push({text, ts:firebase.database.ServerValue.TIMESTAMP}); }
function tlog(i,text){ roomRef('teamLogs/'+tkey(i)).push({text, ts:firebase.database.ServerValue.TIMESTAMP}); }
function txTeam(i, fn){ return roomRef('teams/'+tkey(i)).transaction(t=>{ t=t||newTeam(); const r=fn(t); return r===false?undefined:t; }); }
function txTeams(fn){ return roomRef('teams').transaction(ts=>{ ts=ts||{}; const r=fn(ts); return r===false?undefined:ts; }); }

/* ---------- 방 만들기 / 참여 ---------- */
async function createRoom(){
  const n=Math.max(MIN_TEAMS,Math.min(MAX_TEAMS,parseInt(S.ui.newTeams)||4));
  const pass=(S.ui.newPass||'').trim(); if(!pass){ alert('비밀번호를 정해 주세요.'); return; }
  const code=genCode();
  const teams={}; for(let i=1;i<=n;i++) teams[tkey(i)]=newTeam();
  await db.ref('rooms/'+code).set({ meta:{ pass, teamCount:n, className:S.ui.className||'', status:'playing', lock:true, createdAt:firebase.database.ServerValue.TIMESTAMP }, teams });
  S.code=code; S.pass=pass; S.role='teacher'; S.view='teacher';
  sessionStorage.setItem('cb_session', JSON.stringify({code,pass,role:'teacher'}));
  subscribe();
}
async function joinRoom(code, pass, role, team){
  code=(code||'').trim().toUpperCase(); pass=(pass||'').trim();
  if(!code){ alert('방 코드를 입력하세요.'); return false; }
  const snap=await db.ref('rooms/'+code+'/meta').get();
  if(!snap.exists()){ alert('방이 없습니다. 코드를 확인하세요.'); return false; }
  const meta=snap.val();
  if(meta.pass!==pass){ alert('비밀번호가 일치하지 않습니다.'); return false; }
  S.code=code; S.pass=pass; S.role=role; S.meta=meta;
  if(role==='student'){ S.team=Math.max(1,Math.min(meta.teamCount,parseInt(team)||1)); S.view='student';
    const c=db.ref('rooms/'+code+'/teams/'+tkey(S.team)+'/connected'); c.onDisconnect().set(false); c.set(true); }
  else if(role==='projector'){ S.view='projector'; }
  else { S.view='teacher'; }
  sessionStorage.setItem('cb_session', JSON.stringify({code,pass,role,team:S.team}));
  subscribe(); return true;
}
function leave(){ S.subs.forEach(u=>u()); S.subs=[]; sessionStorage.removeItem('cb_session');
  Object.assign(S,{role:null,code:null,pass:null,team:null,view:'home',meta:null,teams:{},pending:{},boxes:{},logs:[],events:[],teamLogs:[]}); S.ui.randomTeams=null; render(); }

function subscribe(){
  S.subs.forEach(u=>u()); S.subs=[];
  const on=(ref,cb)=>{ const h=ref.on('value',s=>{cb(s);render();}); S.subs.push(()=>ref.off('value',h)); };
  on(roomRef('meta'), s=>{ S.meta=s.val(); if(!S.meta){ alert('교사가 방을 종료(삭제)했습니다.'); leave(); } });
  on(roomRef('teams'), s=>{ S.teams=s.val()||{}; });
  on(roomRef('pending'), s=>{ S.pending=s.val()||{}; });
  on(roomRef('boxes'), s=>{ S.boxes=s.val()||{}; });
  on(roomRef('logs').limitToLast(80), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.logs=a.reverse(); });
  on(roomRef('events').limitToLast(40), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.events=a.reverse(); });
  if(S.role==='student') on(roomRef('teamLogs/'+tkey(S.team)).limitToLast(40), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.teamLogs=a.reverse(); });
  render();
}

/* ---------- 학생 행동 ---------- */
async function mine(key){
  const ex=SOLO.find(e=>e.key===key)||PAIR.find(e=>e.key===key); if(!ex) return;
  if(frozen(S.team)){ flash('자원 생산 정지 상태입니다!'); return; }
  const solo=!!SOLO.find(e=>e.key===key);
  await txTeam(S.team,t=>{ if((t.freezeUntil||0)>now()) return false; t.resource=(t.resource||0)+ex.value; if(solo){t.solo=t.solo||{};t.solo[key]=true;} else {t.pair=t.pair||{};t.pair[key]=true;} });
  const m=`자원 +${ex.value} · ${ex.label}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash(`+${ex.value}`);
}
async function buy(kind){
  const price=PRICES[kind]; let ok=true;
  const r=await txTeam(S.team,t=>{ if((t.resource||0)<price){ok=false;return false;} t.resource-=price; if(kind==='attack') t.attack=(t.attack||0)+1; if(kind==='hp') t.hp=(t.hp==null?STARTING_HP:t.hp)+1; });
  if(!ok || !r.committed){ flash('자원이 부족합니다!'); return; }
  if(kind==='randombox'){ roomRef('pending').push({type:'randombox',team:S.team,ts:firebase.database.ServerValue.TIMESTAMP}); const m=`히든랜덤박스 사용 요청 -${price}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('요청 전송!'); return; }
  const m = kind==='attack' ? `상점 구매(공격권) -${price}` : `상점 구매(HP+1) -${price}`;
  log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('구매!');
}
function myPendingAttacks(){ return Object.values(S.pending).filter(p=>p.type==='attack'&&p.from===S.team).length; }
function canAttack(){ return (T(S.team).attack||0) - myPendingAttacks() > 0; }
function rollGame(to){
  if(!canAttack()) return;
  const r=S.ui.rolls[to]||{count:0,game:null}; let n=r;
  if(r.count<3) n={count:r.count+1, game:MINIGAMES[Math.floor(Math.random()*MINIGAMES.length)]};
  S.ui.rolls[to]=n; S.ui.popupGame=n.game; S.ui.popupTarget=to; render();
}
function confirmAttack(){
  const to=S.ui.popupTarget, game=S.ui.popupGame; if(to==null||!game) return;
  const cd=S.ui.cooldown[to]||0; if(cd>now()){ flash('잠시 후 다시 공격할 수 있어요!'); return; }
  if(!canAttack()) return;
  roomRef('pending').push({type:'attack',from:S.team,to,game,ts:firebase.database.ServerValue.TIMESTAMP});
  S.ui.cooldown[to]=now()+3000; delete S.ui.rolls[to]; S.ui.popupGame=null; S.ui.popupTarget=null;
  const m=`팀 ${to} 공격 성공요청 · 미니게임: ${game}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('공격!');
}
function requestAllClear(){
  const t=T(S.team);
  const ds=Object.keys(t.solo||{}).length, dp=Object.keys(t.pair||{}).length;
  if(ds<SOLO.length||dp<PAIR.length) return;
  if(Object.values(S.pending).some(p=>p.type==='allclear'&&p.team===S.team)){ alert('이미 승인 요청 중입니다.'); return; }

async function approve(id){
  const req=S.pending[id]; if(!req) return;
  await roomRef('pending/'+id).remove();
  if(req.type==='attack'){
    let shielded=false;
    await txTeams(ts=>{ const a=ts[tkey(req.from)]||newTeam(), d=ts[tkey(req.to)]||newTeam();
      if((a.attack||0)>0) a.attack-=1;
      if((d.shield||0)>0){ d.shield-=1; shielded=true; } else { d.hp=Math.max(0,(d.hp==null?STARTING_HP:d.hp)-ATTACK_HP_DAMAGE); a.attackSuccess=(a.attackSuccess||0)+1; shielded=false; }
      ts[tkey(req.from)]=a; ts[tkey(req.to)]=d; });
    const g=req.game?` · 미니게임: ${req.game}`:'';
    if(shielded){ log(`교사 승인: 팀 ${req.from} → 팀 ${req.to} 공격 시도 (방어권으로 무효화)${g}`); tlog(req.from,`공격권 사용 → 팀 ${req.to} 방어권으로 차단${g}`); tlog(req.to,`방어권 자동 사용(팀 ${req.from} 공격 차단)${g}`); addEvent(`🛡️ 팀 ${req.to}이(가) 팀 ${req.from}의 공격을 방어권으로 방어!${g}`); }
    else { log(`교사 승인: 팀 ${req.from} → 팀 ${req.to} 공격 성공 (상대 HP -${ATTACK_HP_DAMAGE}, 공격권 -1)${g}`); tlog(req.from,`공격 성공: 팀 ${req.to} HP -${ATTACK_HP_DAMAGE} (공격권 -1)${g}`); tlog(req.to,`피격: 팀 ${req.from}에게 HP -${ATTACK_HP_DAMAGE}${g}`); addEvent(`⚔️ 팀 ${req.from} → 팀 ${req.to} 공격 성공 (HP -${ATTACK_HP_DAMAGE})${g}`); }
  } else if(req.type==='allclear'){
    let cnt=0;
    await txTeam(req.team,t=>{ t.hp=(t.hp==null?STARTING_HP:t.hp)+ALLCLEAR_HP; t.allClearCount=(t.allClearCount||0)+1; cnt=t.allClearCount; t.solo={}; t.pair={}; });
    log(`교사 승인: 팀 ${req.team} 모든 자원 채굴 보상 → HP +${ALLCLEAR_HP} (반복 ${cnt})`); tlog(req.team,`모든 자원 채굴 보상 승인 → HP +${ALLCLEAR_HP} (반복 ${cnt})`); addEvent(`팀 ${req.team} 모든 자원 채굴 보상 승인 (HP +${ALLCLEAR_HP})`);
  } else if(req.type==='randombox'){
    const roll=Math.floor(Math.random()*7)+1, b=BOX[roll];
    if(b.apply) await txTeam(req.team,t=>{ b.apply(t); });
    const title=`${roll}. ${b.name} - ${b.desc}`;
    await roomRef('boxes/'+tkey(req.team)).set({title, roll, ts:firebase.database.ServerValue.TIMESTAMP});
    log(`히든랜덤박스 결과: 팀 ${req.team} → ${title} 당첨!`); tlog(req.team,`히든랜덤박스 결과: ${title} 당첨!`); addEvent(`🎁 팀 ${req.team} 히든랜덤박스: ${title}`);
    if(roll===4||roll===5){ S.ui.teacherModal={type:roll===4?'swap':'freeze', team:req.team}; render(); }
  }
}
async function cancel(id){
  const req=S.pending[id]; if(!req) return;
  await roomRef('pending/'+id).remove();
  if(req.type==='attack'){ await txTeam(req.from,t=>{ if((t.attack||0)>0) t.attack-=1; }); log(`교사 취소: 팀 ${req.from} → 팀 ${req.to} 공격 요청 (공격권 1 소모)`); tlog(req.from,'공격 요청이 교사에 의해 취소됨 (공격권 1 사용 처리)'); }
  else if(req.type==='allclear'){ log(`교사 취소: 팀 ${req.team} 모든 자원 채굴 보상 요청`); tlog(req.team,'모든 자원 채굴 보상 요청이 교사에 의해 취소됨'); }

}
async function adjust(i, field, delta){
  await txTeam(i,t=>{ const base = field==='hp' ? (t.hp==null?STARTING_HP:t.hp) : (t[field]||0); t[field]=Math.max(0,base+delta); });
  const nm={hp:'HP',attack:'공격권',shield:'방어권',resource:'자원'}[field];
  log(`교사 조정: 팀 ${i} ${nm} ${delta>0?'+':''}${delta}`); tlog(i,`교사가 조정함: ${nm} ${delta>0?'+':''}${delta}`);
}
async function swapResources(a,b){

  await txTeams(ts=>{ const A=ts[tkey(a)]||newTeam(), B=ts[tkey(b)]||newTeam(); const tmp=A.resource||0; A.resource=B.resource||0; B.resource=tmp; ts[tkey(a)]=A; ts[tkey(b)]=B; });
  log(`AMAZING 효과: 팀 ${a} ↔ 팀 ${b} 자원 교환`); tlog(a,`AMAZING: 팀 ${b}와 자원 교환`); tlog(b,`AMAZING: 팀 ${a}와 자원 교환`); addEvent(`✨ AMAZING 발동: 팀 ${a}와 팀 ${b}의 자원이 교환됨`);

function shuffleTeams(){
  const n=Math.max(1,parseInt(S.ui.students)||30), npc=Math.max(0,parseInt(S.ui.npc)||0), tc=teamCount();
  const st=Array.from({length:n},(_,i)=>i+1);

  const npcList=st.slice(0,npc), rest=st.slice(npc), teams=Array.from({length:tc},()=>[]);
  rest.forEach((s,i)=>teams[i%tc].push(s)); teams.forEach(t=>t.sort((a,b)=>a-b));

function hpRing(hp,size){ size=size||100; hp=hp==null?STARTING_HP:hp; const max=Math.max(STARTING_HP,hp), r=size*0.42, C=2*Math.PI*r, pct=Math.max(0,Math.min(1,hp/max)), sw=size*0.12;
  const col = hp<=0?'#9ca3af': hp<=3?'#ef4444': hp<=6?'#f59e0b':'#10b981';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="#fff" stroke="#e5e7eb" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${pct*C} ${C-pct*C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="${size*0.22}">HP ${hp}</text></svg>`; }
function bars(t){ const mx=Math.max(5,t.attack||0,t.shield||0,t.resource||0); const row=(l,v)=>`<div class="bar"><div class="t"><span>${l}</span><b>${v||0}</b></div><div class="b"><i style="width:${(v||0)/mx*100}%"></i></div></div>`; return row('공격권',t.attack)+row('방어권',t.shield)+row('자원',t.resource); }
function teamCard(i,size){ const t=T(i); const fz=frozen(i); const dead=(t.hp!=null&&t.hp<=0);
  return `<div class="team-card ${dead?'hp0':''}" style="border-color:${TEAM_COLORS[i-1]}"><div class="nm" style="color:${TEAM_COLORS[i-1]}">팀 ${i} ${t.connected?'<span class="badge b-green" title="접속 중">●</span>':'<span class="badge" title="미접속">○</span>'}</div>${hpRing(t.hp,size)}${bars(t)}${fz?`<div class="badge b-red" style="margin-top:6px">⏱ 생산정지 ${Math.ceil(fz/60)}분</div>`:''}</div>`; }
function classroomMap(){ const n=teamCount(); return `<div class="map"><div class="desk">[교탁]</div><div class="seats" style="grid-template-columns:repeat(${n<=4?2:3},1fr)">${teamIdx().map(i=>`<div class="seat" style="background:${TEAM_BG[i-1]};color:${TEAM_COLORS[i-1]}">팀 ${i}</div>`).join('')}</div><div class="muted">교실 팀 배치 안내도</div></div>`; }

  return `${lockRow}<div class="cols">

    <div class="row" style="justify-content:space-between"><h2 style="margin:0;color:${TEAM_COLORS[i-1]}">팀 ${i} 기록</h2><span class="row"><span class="badge">자원 ${t.resource||0}</span><span class="badge b-red">공격권 ${t.attack||0}</span><span class="badge b-blue">방어권 ${t.shield||0}</span><span class="badge b-green">HP ${t.hp==null?STARTING_HP:t.hp}</span></span></div>
    ${fz?`<div class="warn" style="margin-top:8px">⚠️ 자원 생산 정지 상태입니다. (${Math.floor(fz/60)}분 ${fz%60}초 남음)</div>`:''}
    <h3>자원 채굴 (1인) <button class="sm" data-a="toggle" data-k="help">?</button></h3>
    ${S.ui.help?`<div class="info"><b>자원채굴 도움말</b><br>${HELP_SOLO.map((h,k)=>`${k+1}. ${h}`).join('<br>')}<br><b>2인</b><br>${HELP_PAIR.map(h=>'· '+h).join('<br>')}</div>`:''}
    <div class="grid g2">${SOLO.map(ex=>exBtn(ex,(t.solo||{})[ex.key])).join('')}</div>
    <h3>자원 채굴 (2인)</h3><div class="grid g2">${PAIR.map(ex=>exBtn(ex,(t.pair||{})[ex.key])).join('')}</div>
    <h3>상점</h3><div class="grid g2"><button data-a="buy" data-k="attack">⚔️ 공격권 – 자원 ${PRICES.attack}</button><button data-a="buy" data-k="hp">❤️ HP(라이프)+1 – 자원 ${PRICES.hp}</button></div>
    <div class="row" style="margin-top:8px"><button style="flex:1" data-a="buy" data-k="randombox">🎁 히든랜덤박스 – 자원 ${PRICES.randombox} (교사 승인 필요)</button><button class="sm" data-a="toggle" data-k="boxInfo">i</button></div>
    ${S.ui.boxInfo?`<div class="info"><b>히든랜덤박스</b><br>${Object.entries(BOX).map(([k,b])=>`${k}. ${b.name} - ${b.desc}`).join('<br>')}<br><span class="muted">1·2·3·6·7은 뽑는 순간 자동 적용, 4·5는 교사가 상대 팀을 지정합니다.</span></div>`:''}
    <h3>공격 성공요청하기 <button class="sm" data-a="toggle" data-k="gameInfo">i</button></h3>
    <div class="muted" style="margin-bottom:6px">대기 중 ${myPendingAttacks()} / 보유 공격권 ${t.attack||0} · 버튼을 누르면 미니게임이 랜덤으로 정해집니다.</div>
    ${S.ui.gameInfo?`<div class="info"><b>미니게임 목록</b><br>${MINIGAMES.map(g=>'· '+g).join('<br>')}</div>`:''}
    <div class="grid g2">${teamIdx().filter(k=>k!==i).map(k=>`<button class="btn-red" data-a="attack" data-i="${k}" ${canAttack()?'':'disabled'}>팀 ${k} 공격 성공요청</button>`).join('')}</div>
    <h3>모든 자원 채굴 실시 <span class="badge b-green">HP 회복 +${ALLCLEAR_HP}</span></h3>
    <div class="muted" style="margin-bottom:6px">1인 ${ds}/${SOLO.length} · 2인 ${dp}/${PAIR.length} · 반복 ${t.allClearCount||0}</div>
    <button data-a="allclear" ${allDone?'':'disabled'}>교사에게 허용요청 보내기</button>
  </div>
  <div>
    <div class="card"><h2>우리 팀 로그</h2>${logBox(S.teamLogs)}</div>
    <div class="card"><h2>팀 상황 보기</h2><div class="grid gauto">${teamIdx().map(k=>teamCard(k,80)).join('')}</div></div>
    <div class="card"><h2>전투 이벤트</h2>${logBox(S.events,'🔥')}</div>
  </div></div>`;
}

function renderProjector(){
  return `<div class="cols"><div class="card center">${classroomMap()}</div>${requestPanel()}</div>
  <div class="grid" style="grid-template-columns:repeat(${Math.min(teamCount(),3)},1fr)">${teamIdx().map(i=>teamCard(i,130)).join('')}</div>
  <div class="cols" style="margin-top:12px"><div class="card"><h2>전체 로그</h2>${logBox(S.logs)}</div><div class="card"><h2>전투 이벤트</h2>${logBox(S.events,'🔥')}</div></div>`;
}

function renderTeacher(){
  const m=S.meta||{}; const ct=S.ui.controlTeam; const t=T(ct); const fz=frozen(ct);
  const sel=(name,val,skipA)=>`<select data-in="${name}">${teamIdx().map(i=>`<option value="${i}" ${val==i?'selected':''}>팀 ${i}</option>`).join('')}</select>`;
  const adj=(f,d)=>`<button class="sm" data-a="adjust" data-f="${f}" data-d="${d}">${{hp:'HP',attack:'공격권',shield:'방어권',resource:'자원'}[f]} ${d>0?'+':''}${d}</button>`;
  return `<div class="card"><div class="row" style="justify-content:space-between">
    <div><h2 style="margin:0">교사용 대시보드</h2><div class="muted">방 코드 <b style="font-size:16px;color:#111">${S.code}</b> · 비밀번호 <b>${esc(S.pass)}</b> · ${m.status==='ended'?'<span class="badge b-red">종료됨</span>':'<span class="badge b-green">진행 중</span>'}</div></div>
    <div class="row"><button class="btn-yellow sm" data-a="lock">${m.lock===false?'🔓 잠금 해제 (학생: 팀 선택 가능)':'🔒 잠금 (학생: 자기 팀만)'}</button><button class="sm btn-green" data-a="endSave" ${S.ui.saving?'disabled':''}>${S.ui.saving?'저장 중…':'🏁 게임 종료 & 결과 저장'}</button><button class="sm" data-a="dl">로그 저장</button><button class="sm" data-a="reset">초기화</button><button class="sm btn-red" data-a="delete">방 삭제</button></div></div></div>
  <div class="card"><details ${S.ui.qrOpen?'open':''}><summary>📱 접속 QR코드 / 링크 <span class="muted">(학생 태블릿 카메라로 찍으면 바로 자기 팀으로 들어옵니다)</span></summary>
    <div class="row" style="margin-top:10px;align-items:flex-start">${teamIdx().map(i=>`<div class="qrbox"><b style="color:${TEAM_COLORS[i-1]}">팀 ${i}</b><div class="qr" data-url="${esc(teamUrl(i))}"></div><button class="sm" data-a="copy" data-url="${esc(teamUrl(i))}">링크 복사</button></div>`).join('')}<div class="qrbox"><b>관전자(프로젝터)</b><div class="qr" data-url="${esc(projUrl())}"></div><button class="sm" data-a="copy" data-url="${esc(projUrl())}">링크 복사</button></div></div>
    ${location.protocol==='file:'?'<div class="warn" style="margin-top:8px">지금은 파일을 직접 연 상태라 QR이 다른 기기에서 열리지 않습니다. 인터넷에 올린 주소로 열어야 QR이 작동합니다.</div>':''}</details></div>
  ${requestPanel()}
  <div class="grid" style="grid-template-columns:repeat(${Math.min(teamCount(),3)},1fr)">${teamIdx().map(i=>teamCard(i,100)).join('')}</div>
  <div class="card" style="margin-top:12px"><h2>교사 전용 자원 / 능력 조정</h2>
    <div class="row" style="margin-bottom:8px"><span class="muted">대상 팀:</span>${teamIdx().map(i=>`<button class="sm ${ct===i?'btn-blue':''}" data-a="ctrl" data-i="${i}">팀 ${i}</button>`).join('')}</div>
    <div class="grid g3">
      <div class="info"><b>팀 ${ct} 현재 상태</b><br>HP ${t.hp==null?STARTING_HP:t.hp} · 공격권 ${t.attack||0} · 방어권 ${t.shield||0} · 자원 ${t.resource||0}<br>공격 성공 ${t.attackSuccess||0}회 · 올클리어 ${t.allClearCount||0}회${fz?`<br><span style="color:#b91c1c">자원생산 정지 (${Math.ceil(fz/60)}분 남음)</span>`:''}</div>
      <div><b style="font-size:13px">자원 조정</b><div class="row" style="margin-top:4px">${adj('resource',1)}${adj('resource',-1)}${adj('resource',5)}${adj('resource',-5)}${adj('resource',10)}${adj('resource',-10)}</div></div>
      <div><b style="font-size:13px">능력 조정</b><div class="row" style="margin-top:4px">${adj('attack',1)}${adj('attack',-1)}${adj('shield',1)}${adj('shield',-1)}${adj('hp',1)}${adj('hp',-1)}</div></div>
    </div>
    <div class="cols" style="margin-top:10px">
      <div class="info"><b>✨ AMAZING: 자원 바꾸기</b><div class="row" style="margin-top:4px">${sel('swapA',S.ui.swapA)} ↔ ${sel('swapB',S.ui.swapB)} <button class="sm btn-purple" data-a="swap">자원 바꾸기</button></div></div>
      <div class="info"><b>⏱️ UNBELIEVABLE: 자원생산 3분 정지</b><div class="row" style="margin-top:4px">${sel('freezeT',S.ui.freezeT)} <button class="sm btn-red" data-a="freeze">정지(3분)</button></div></div>
    </div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🔀 랜덤 팀 편성</h2><span class="row"><input type="number" min="1" max="60" style="width:80px" data-in="students" value="${S.ui.students}" title="학생 수"> 명 중 NPC <input type="number" min="0" max="30" style="width:70px" data-in="npc" value="${S.ui.npc}"> 명 <button class="btn-dark sm" data-a="shuffle">섞기</button></span></div>
    <div class="muted">학생 번호를 무작위로 섞어 NPC를 먼저 뽑고, 나머지를 ${teamCount()}개 팀에 고르게 나눕니다.</div>
    ${S.ui.randomTeams?`<div class="grid gauto" style="margin-top:8px">${S.ui.randomTeams.teams.map((arr,k)=>`<div class="info" style="border-color:${TEAM_COLORS[k]}"><b style="color:${TEAM_COLORS[k]}">팀 ${k+1}</b> (${arr.length}명)<br>${arr.join(', ')||'—'}</div>`).join('')}<div class="info"><b>NPC</b> (${S.ui.randomTeams.npc.length}명)<br>${S.ui.randomTeams.npc.join(', ')||'—'}</div></div>`:''}</div>
  <div class="cols"><div class="card"><h2>전체 로그</h2>${logBox(S.logs)}</div><div class="card"><h2>전투 이벤트</h2>${logBox(S.events,'🔥')}</div></div>`;
}

function render(){
  let body='';
  if(S.view==='home') body=renderHome();
  else if(S.view==='student') body=renderStudent();
  else if(S.view==='projector') body=renderProjector();
  else if(S.view==='teacher') body=renderTeacher();
  const active=document.activeElement; const keep = active && active.dataset && active.dataset.in ? {name:active.dataset.in, pos:active.selectionStart} : null;
  $('#app').innerHTML = topbar()+body+modal()+(S.flash?`<div class="flash">${esc(S.flash)}</div>`:'');
  if(keep){ const el=document.querySelector(`[data-in="${keep.name}"]`); if(el){ el.focus(); try{ el.setSelectionRange(keep.pos,keep.pos);}catch(_){} } }
  document.querySelectorAll('.qr').forEach(el=>{ if(!el.dataset.done){ el.dataset.done='1'; try{ new QRCode(el,{text:el.dataset.url,width:120,height:120,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent='QR 생성 실패'; } } });
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, d=el.dataset;
  try{
    switch(a){
      case 'createRoom': await createRoom(); break;
      case 'joinStudent': await joinRoom(S.ui.joinCode,S.ui.joinPass,'student',S.ui.joinTeam); break;
      case 'joinProjector': await joinRoom(S.ui.joinCode,S.ui.joinPass,'projector'); break;
      case 'joinTeacher': if(prompt('교사 비밀번호')!==CONFIG.teacherPassword){ alert('비밀번호가 올바르지 않습니다.'); break; } await joinRoom(S.ui.joinCode,S.ui.joinPass,'teacher'); break;
      case 'leave': if(S.role!=='teacher' || confirm('교사 화면에서 나갈까요? (방은 유지되며, 방 코드와 비밀번호로 다시 들어올 수 있습니다)')) leave(); break;
      case 'view': if(d.v==='teacher' && S.role!=='teacher' && prompt('교사 비밀번호')!==CONFIG.teacherPassword){ alert('비밀번호가 올바르지 않습니다.'); break; } S.view=d.v; render(); break;
      case 'mine': await mine(d.k); break;
      case 'buy': await buy(d.k); break;
      case 'attack': rollGame(parseInt(d.i)); break;
      case 'reroll': rollGame(parseInt(d.i)); break;
      case 'confirmAttack': confirmAttack(); break;
      case 'cancelPopup': S.ui.popupGame=null; S.ui.popupTarget=null; render(); break;
      case 'allclear': requestAllClear(); break;
      case 'dismissBox': S.ui.dismissedBox=Number(d.ts); roomRef('boxes/'+tkey(S.team)).remove(); render(); break;
      case 'switchTeam': { const k=parseInt(d.i); roomRef('teams/'+tkey(S.team)+'/connected').set(false); S.team=k; const c=roomRef('teams/'+tkey(k)+'/connected'); c.onDisconnect().set(false); c.set(true); subscribe(); break; }
      case 'toggle': S.ui[d.k]=!S.ui[d.k]; render(); break;
      case 'filter': S.ui.pendingFilter=d.k; render(); break;
      case 'approve': await approve(d.id); break;
      case 'cancel': await cancel(d.id); break;
      case 'ctrl': S.ui.controlTeam=parseInt(d.i); render(); break;
      case 'adjust': await adjust(S.ui.controlTeam,d.f,parseInt(d.d)); break;
      case 'swap': await swapResources(parseInt(S.ui.swapA),parseInt(S.ui.swapB)); break;
      case 'freeze': await freezeTeam(parseInt(S.ui.freezeT)); break;
      case 'modalPick': { const m=S.ui.teacherModal; S.ui.teacherModal=null; if(m.type==='swap') await swapResources(m.team,parseInt(d.i)); else await freezeTeam(parseInt(d.i)); render(); break; }
      case 'modalClose': S.ui.teacherModal=null; render(); break;
      case 'lock': toggleLock(); break;
      case 'shuffle': shuffleTeams(); break;
      case 'reset': await resetRoom(); break;
      case 'delete': await deleteRoom(); break;
      case 'endSave': await endAndSave(); break;
      case 'dl': downloadLogs(); break;
      case 'copy': try{ await navigator.clipboard.writeText(d.url); flash('복사됨'); }catch(_){ prompt('링크를 복사하세요', d.url); } break;
    }
  }catch(err){ console.warn(err); showErr(err.message||String(err)); }
});
document.addEventListener('input', e=>{ const el=e.target; if(el.dataset && el.dataset.in){ S.ui[el.dataset.in]=el.value; } });
document.addEventListener('change', e=>{ const el=e.target; if(el.dataset && el.dataset.in && el.tagName==='SELECT'){ S.ui[el.dataset.in]=el.value; render(); } });
document.addEventListener('toggle', e=>{ if(e.target.tagName==='DETAILS'){ const s=e.target.querySelector('summary'); if(s && s.textContent.includes('QR')) S.ui.qrOpen=e.target.open; if(s && s.textContent.includes('교사 메뉴')) S.ui.teacherOpen=e.target.open; } }, true);
setInterval(()=>{ if(S.role && teamIdx().some(i=>frozen(i))) render(); }, 1000);

/* ---------- 시작: URL 파라미터 / 세션 복구 ---------- */
(async function init(){
  render();
  const p=new URLSearchParams(location.search);
  if(p.get('room')){
    const code=p.get('room'), pass=p.get('pass')||'';
    if(p.get('view')==='projector') await joinRoom(code,pass,'projector');
    else if(p.get('team')) await joinRoom(code,pass,'student',p.get('team'));
    else { S.ui.joinCode=code; S.ui.joinPass=pass; render(); }
    return;
  }
  try{ const s=JSON.parse(sessionStorage.getItem('cb_session')||'null'); if(s && s.code){ await joinRoom(s.code,s.pass,s.role,s.team); } }catch(_){}
})();
</script>
