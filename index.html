<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="배틀그라운드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8664A">
<title>클래스 배틀그라운드</title>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 노을 운동장 테마 (v3) ===== */
  :root{--bg:#FFF3E4;--card:#fff;--ink:#3A2A1E;--muted:#7A5A44;--line:#F1DCC4;--soft:#FFF8EF;--track:#F5E3CF;
        --coral:#E8664A;--gold:#F2B33D;--red:#E0563E;--blue:#3F7FC4;--green:#4E9F5B;--purple:#8A63C9;--yellow:#D9982B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  .jua,h1,h2,.card h2{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
  #app{max-width:1320px;margin:0 auto;padding:14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;background:var(--coral);color:#fff;border-radius:22px;padding:12px 20px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
  .brand h1{font-size:28px;margin:0;line-height:1.1}
  .brand small{color:#FFE7DC;font-size:13px}
  .top .badge{background:#fff;color:var(--ink)}
  .top button{background:#fff;border-color:#fff;color:var(--ink)}
  .top .btn-blue{background:var(--ink);border-color:var(--ink);color:#fff}
  .top .btn-green{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .card{background:var(--card);border-radius:22px;box-shadow:0 2px 0 var(--line);padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:24px;margin:0 0 10px}
  .card h3{font-size:15px;margin:14px 0 8px;color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gauto{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  @media(min-width:900px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cols.wide{grid-template-columns:1.5fr 1fr}}
  button{font:inherit;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--ink);transition:transform .08s}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-red{background:var(--red);color:#fff;border-color:var(--red)}
  .btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green)}
  .btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
  .btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-yellow{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .sm{padding:5px 11px;font-size:13px;border-radius:999px;min-height:32px}
  .lg{padding:14px 18px;font-size:18px;font-weight:700}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft)}
  .b-red{background:#FDE4DD;color:#A63A22}.b-blue{background:#E2EDF8;color:#2B5E96}.b-green{background:#E3F1E4;color:#2F6B3A}.b-pur{background:#EDE3F8;color:#5E3E99}
  input,select{font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink);min-height:44px}
  .muted{color:var(--muted);font-size:13px}
  .log{max-height:240px;overflow-y:auto;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}
  .log div{padding:3px 0}
  /* 팀 카드 */
  .team-card{border-radius:20px;padding:12px 14px;background:var(--soft);position:relative;display:flex;flex-direction:column;gap:8px}
  .tc-head{display:flex;align-items:center;gap:8px;font-size:20px}
  .tc-hp{font-size:40px;line-height:1;display:flex;align-items:center;gap:6px}.tc-hp small{font-size:15px;color:var(--muted);font-family:"Noto Sans KR",sans-serif;font-weight:700}
  .tbadge{width:44px;height:44px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Jua",sans-serif;font-size:24px;flex:none}
  .tbadge.s{width:32px;height:32px;border-radius:10px;font-size:18px}
  .dot{width:10px;height:10px;border-radius:50%;background:#D9C2A8;display:inline-block}.dot.on{background:var(--green)}
  .hpbar{height:14px;border-radius:999px;background:var(--track);overflow:hidden}.hpbar.big{height:22px}
  .hpbar i{display:block;height:100%;border-radius:999px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .rk-row .chips{justify-content:flex-end}
  .chip{border-radius:14px;padding:4px 12px 4px 6px;font-family:"Jua",sans-serif;font-size:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .ic{flex:none;display:inline-block;vertical-align:middle}
  .c-atk{background:#FDE4DD;color:#A63A22}.c-shd{background:#E2EDF8;color:#2B5E96}.c-res{background:#EFE8FD;color:#5E3E99}
  /* 순위표 (관전자) */
  .rk{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .rk-row{background:#fff;border-radius:22px;box-shadow:0 2px 0 var(--line);display:grid;grid-template-columns:64px minmax(170px,230px) 1fr 100px 270px;align-items:center;gap:14px;padding:12px 18px 12px 12px}
  .medal{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Jua",sans-serif;font-size:26px;color:var(--ink)}
  .rk-team{display:flex;align-items:center;gap:12px}.rk-team .tbadge{width:54px;height:54px;border-radius:18px;font-size:30px}
  .rk-name{font-size:24px;line-height:1.1}.rk-st{font-size:13px;font-weight:700}
  .rk-hp{font-size:44px;text-align:center;line-height:1;display:flex;align-items:center;justify-content:center;gap:6px}.rk-hp small{font-size:15px;color:var(--muted)}
  @media(max-width:900px){.rk-row{grid-template-columns:52px 1fr auto}.rk-row .hpbar{grid-column:1/-1}.rk-row .chips{grid-column:1/-1}.medal{width:44px;height:44px;font-size:22px}}
  /* 소식 */
  .news{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
  @media(max-width:700px){.news{grid-template-columns:1fr}}
  .news div{display:flex;align-items:center;gap:10px;font-size:15px}
  .news i{width:10px;height:10px;border-radius:50%;flex:none}
  /* 학생 */
  .s-head{color:#fff;border-radius:24px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .s-head .tbadge{background:#fff;width:58px;height:58px;border-radius:20px;font-size:32px}
  .s-title{font-size:28px;line-height:1.1}.s-sub{font-size:14px;opacity:.9}
  .s-stats{display:flex;gap:8px;flex-wrap:wrap}
  .s-stat{background:#fff;color:var(--ink);border-radius:18px;padding:4px 14px 4px 8px;display:flex;align-items:center;gap:6px;min-width:72px}
  .s-stat div{display:flex;flex-direction:column;line-height:1.05}
  .s-stat span{font-size:12px;font-weight:700;color:var(--muted)}.s-stat b{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;line-height:1}
  .ex{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:62px;border-radius:18px;padding:8px 10px 8px 16px}
  .ex .ex-l{display:flex;flex-direction:column}.ex .ex-t{font-family:"Jua",sans-serif;font-size:18px}.ex .ex-s{font-size:12px;font-weight:700;color:var(--muted)}
  .ex .chip2{min-width:50px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:"Jua",sans-serif;font-size:20px;background:var(--gold);color:var(--ink)}
  .ex.done{background:#EAF5EA;border-color:#9FD0A6}.ex.done .ex-s{color:#2F6B3A}.ex.done .chip2{background:var(--green);color:#fff}
  .ex.cool,.ex:disabled{opacity:1;background:#F7EDE2;border-color:#F7EDE2;color:var(--muted)}.ex.cool .chip2,.ex:disabled .chip2{background:#EAD9C6;color:var(--muted)}
  .shop{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;border:none;color:#fff;font-weight:700;font-size:16px;padding:0 18px}
  .shop b{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;display:inline-flex;align-items:center;gap:3px}
  .shop .sl{display:inline-flex;align-items:center;gap:10px}
  .shop.atk{background:var(--coral)}.shop.hp{background:var(--green)}.shop.box{background:var(--gold);color:var(--ink)}
  .tgt{min-height:80px;border:none;font-family:"Jua",sans-serif;font-size:22px;border-radius:18px}
  .pill{background:#FCEFD2;color:#8A5A00;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
  .pend{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:15px}
  .modal{position:fixed;inset:0;background:rgba(58,42,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:26px;padding:22px;max-width:440px;width:100%;text-align:center;animation:pop .25s ease}
  .modal h2{font-size:28px}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .flash{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:16px;font-family:"Jua",sans-serif;animation:pop .2s ease}
  .qrwrap{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;margin-top:14px;padding:10px 0}
  .qrbox{display:inline-flex;flex-direction:column;align-items:center;gap:8px;border-radius:20px;padding:16px;background:var(--soft)}
  .qrbox b{font-size:18px;font-family:"Jua",sans-serif;font-weight:400}
  .roomkey{display:inline-block;margin-left:10px;color:#C2410C;font-size:16px;font-weight:800;white-space:nowrap}
  .roomkey b{font-size:19px;letter-spacing:1px}
  .qr img,.qr canvas{display:block;background:#fff;padding:6px;border-radius:8px}
  .map{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
  .map .desk{padding:4px 14px;border-radius:999px;background:var(--soft);font-size:13px}
  .map .seats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;border-radius:16px;padding:8px;background:var(--soft)}
  .map .seat{padding:6px 14px;border-radius:10px;font-weight:700;font-size:14px}
  .info{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:6px}
  .warn{background:#FDE4DD;color:#A63A22;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}
  .center{text-align:center}
  .hp0{filter:grayscale(1);opacity:.6}
  details summary{cursor:pointer;font-weight:700}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{border-radius:18px;padding:12px;text-align:center}
  .tile .nm{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
  .tile .n{font-size:34px;font-family:"Jua",sans-serif;margin:2px 0}
  .tile .bt{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .tile .bt button{min-width:40px;height:40px;font-weight:800;padding:0 8px;background:#fff}
  .tile.t-res{background:#EFE8FD}.tile.t-res .n{color:#5E3E99}
  .tile.t-atk{background:#FDE4DD}.tile.t-atk .n{color:#A63A22}
  .tile.t-shd{background:#E2EDF8}.tile.t-shd .n{color:#2B5E96}
  .tile.t-hp{background:#E3F1E4}.tile.t-hp .n{color:#2F6B3A}
  /* 전체화면 */
  .fs-btn{display:inline-flex;align-items:center;gap:6px}
  body.fs #app{max-width:none;padding:10px 16px}
  body.fs .top{padding:8px 16px;margin-bottom:10px;border-radius:18px}
  body.fs .brand h1{font-size:22px}
  body.fs .center.muted{display:none}
  @media (display-mode: standalone){ body{padding-top:env(safe-area-inset-top)} }
  /* v8: 이벤트·퀴즈·스태프·체력 요소 */
  .ev-banner{border-radius:24px;padding:16px 22px;margin-bottom:14px;background:#3A2A1E;color:#fff;display:flex;flex-direction:column;gap:6px}
  .ev-banner .t{font-family:"Jua",sans-serif;font-size:40px;line-height:1.1;color:#FFD979}
  .ev-banner .d{font-size:18px;line-height:1.5}
  .ev-banner .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .ev-banner .rw span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
  .ev-soon{border-radius:22px;padding:12px 20px;margin-bottom:14px;background:#EDE3F8;color:#5E3E99;font-family:"Jua",sans-serif;font-size:26px;display:flex;align-items:center;gap:12px}
  .evmodal .box{max-width:620px;background:#3A2A1E;color:#fff}
  .evmodal h2{color:#FFD979;font-size:44px;margin:6px 0}
  .quiz{border-radius:20px;background:#EDE3F8;padding:16px;display:flex;flex-direction:column;gap:10px}
  .quiz .qh{font-family:"Jua",sans-serif;font-size:24px;color:#5E3E99}
  .quiz .qq{font-size:19px;font-weight:700;line-height:1.5}
  .quiz .qo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
  .quiz .qo button{background:#fff;border-color:#D2C2F2;text-align:left;font-weight:700;min-height:52px}
  .quiz .prev{background:#fff;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5}
  .fit{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .fit i{font-style:normal;font-size:11px;font-weight:900;color:#fff;border-radius:999px;padding:1px 7px}
  .fitbar{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:4px 0}
  .fitbar .tr{height:14px;border-radius:999px;background:var(--track);overflow:hidden}.fitbar .tr i{display:block;height:100%;border-radius:999px}
  .rank-pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .staff-head{border-radius:22px;padding:14px 20px;margin-bottom:14px;background:#2F6B3A;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .staff-head b{font-family:"Jua",sans-serif;font-weight:400;font-size:30px}
  /* 지금 상태판 (v7) */
  .s-now{background:#fff;color:var(--ink);border-radius:20px;padding:8px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1 1 260px;max-width:440px;text-align:center}
  .s-now .lbl{font-size:13px;font-weight:900;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .s-now .pre{font-size:13px;font-weight:700;color:#7A5A44}
  .s-now .gname{font-family:"Jua",sans-serif;font-weight:400;font-size:38px;line-height:1.1;color:#A63A22}
  .s-now .vs{font-size:14px;font-weight:700}
  .s-now.game{background:#FFF3C4;box-shadow:inset 0 0 0 4px #F2B33D;animation:nowPulse 1.6s ease-in-out var(--ph,0s) infinite}
  .s-now.game .lbl{color:#A63A22}
  .s-now.mine .gname{font-size:22px;color:#2F6B3A}
  .s-now.stop .gname{font-size:22px;color:#A63A22}
  .live{width:10px;height:10px;border-radius:50%;background:#E0563E;display:inline-block;animation:blink 1s steps(2) var(--ph,0s) infinite}
  @keyframes blink{50%{opacity:.2}}
  @keyframes nowPulse{50%{transform:scale(1.025)}}
  .tv-now{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .tv-game{background:#FFF3C4;box-shadow:inset 0 0 0 4px #F2B33D;border-radius:22px;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .tv-game .lbl{font-size:15px;font-weight:900;color:#A63A22;display:inline-flex;align-items:center;gap:8px}
  .tv-game .vs{display:flex;align-items:center;gap:10px;font-family:"Jua",sans-serif;font-size:26px}
  .tv-game .gname{font-family:"Jua",sans-serif;font-size:40px;color:#A63A22;line-height:1.1;margin-left:auto}
  /* 운동 그림 카드 (v6) */
  .exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .ex2{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 8px 10px;border-radius:20px;border:3px solid var(--line);background:#fff;min-height:0}
  .ex2 .pic{position:relative;width:100%;border-radius:14px;background:var(--soft);display:flex;justify-content:center;padding:4px 0}
  .ex2 .pic svg.pg{width:100%;max-width:160px;height:auto}
  .ex2 .nm{font-family:"Jua",sans-serif;font-size:17px;line-height:1.2;text-align:center}
  .ex2 .rp{font-size:12px;font-weight:700;color:var(--muted)}
  .ex2 .st{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;background:var(--gold);color:var(--ink)}
  .ex2.done{border-color:#9FD0A6}.ex2.done .st{background:var(--green);color:#fff}
  .ex2:disabled{opacity:1}
  .ex2.cool .pg{opacity:.35}.ex2.cool .st{background:#EAD9C6;color:var(--muted)}
  .ex2.cool .pg *{animation-play-state:paused}
  .ex2 .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Jua",sans-serif;font-size:36px;color:var(--muted)}
  .ex2 .pair{position:absolute;top:6px;left:6px;background:var(--coral);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:900}
  .ex2 .ok{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
  body.still .pg *{animation:none!important}
  @media (prefers-reduced-motion: reduce){ .pg *{animation:none!important} }
  .pg line,.pg polyline{stroke:#3A2A1E;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .pg .hd{fill:#3A2A1E;stroke:none}
  .pg .p2 line,.pg .p2 polyline{stroke:#E8664A}
  .pg .p2 .hd{fill:#E8664A}
  .pg .far line,.pg .far polyline,.pg line.far,.pg polyline.far{stroke:#B89A7E}
  .pg .p2 .far line,.pg .p2 line.far{stroke:#F2A08C}
  .pg line.gr{stroke:#E6D3BD;stroke-width:3}
  .pg *{transform-box:view-box}
  .pg .f{opacity:0}
  @keyframes puBody{50%{transform:rotate(-9deg)}}
  @keyframes puArm{50%{transform:scaleY(.6)}}
  @keyframes jjAL{50%{transform:rotate(110deg)}}
  @keyframes jjAR{50%{transform:rotate(-110deg)}}
  @keyframes jjLL{50%{transform:rotate(18deg)}}
  @keyframes jjLR{50%{transform:rotate(-18deg)}}
  @keyframes lrLeg{50%{transform:rotate(-70deg)}}
  @keyframes tmr{from{stroke-dashoffset:63}to{stroke-dashoffset:0}}
  @keyframes sqS{0%,10%,90%,100%{transform:rotate(0)}45%,55%{transform:rotate(35deg)}}
  @keyframes sqT{0%,10%,90%,100%{transform:rotate(0)}45%,55%{transform:rotate(-110deg)}}
  @keyframes sqB{0%,10%,90%,100%{transform:rotate(0)}45%,55%{transform:rotate(100deg)}}
  @keyframes sqA{0%,10%,90%,100%{transform:rotate(0)}45%,55%{transform:rotate(-115deg)}}
  @keyframes psB{0%,10%,90%,100%{transform:rotate(0)}45%,55%{transform:rotate(85deg)}}

function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fsSupported(){ const d=document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); }
function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
async function toggleFullscreen(){
  try{
    if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(!fsSupported()){ alert('이 기기는 전체화면 버튼을 지원하지 않아요.\n\n아이폰/아이패드: 사파리 아래쪽 [공유] → [홈 화면에 추가] 후, 홈 화면 아이콘으로 열면 주소창 없이 보여요.'); return; }

}

async function createRoom(){
  await waitAuth();
  const n=Math.max(MIN_TEAMS,Math.min(MAX_TEAMS,parseInt(S.ui.newTeams)||4));
  const pass=(S.ui.newPass||'').trim(); if(!pass){ alert('비밀번호를 정해 주세요.'); return; }
  const code=genCode();
  const teams={}; for(let i=1;i<=n;i++) teams[tkey(i)]=newTeam();
  await db.ref('rooms/'+code).set({ meta:{ pass, teamCount:n, className:S.ui.className||'', status:'playing', lock:true, staffPin:String(Math.floor(1000+Math.random()*9000)), quizEvery:QUIZ_EVERY_DEFAULT, createdAt:firebase.database.ServerValue.TIMESTAMP }, teams });
  S.code=code; S.pass=pass; S.role='teacher'; S.view='teacher';
  sessionStorage.setItem('cb_session', JSON.stringify({code,pass,role:'teacher'}));
  subscribe();
}
async function joinRoom(code, pass, role, team, pin){
  code=(code||'').trim().toUpperCase(); pass=(pass||'').trim();
  if(!code){ alert('방 코드를 입력하세요.'); return false; }
  if(!/^[A-Z2-9]{6}$/.test(code)){ alert('방 코드를 다시 확인하세요.\n영어 대문자·숫자 6자리입니다. (숫자 0·1, 영어 O·I는 쓰지 않아요)'); return false; }
  await waitAuth();
  let snap;
  try{ snap=await db.ref('rooms/'+code+'/meta').get(); }
  catch(e){ alert(/permission/i.test(String(e&&(e.code||e.message)))?'접속 권한 오류입니다. 잠시 후 새로고침해 주세요. (방 코드도 다시 확인)':'접속 오류: '+(e.message||e)); return false; }
  if(!snap.exists()){ alert('방이 없습니다. 코드를 확인하세요.'); return false; }
  const meta=snap.val();
  if(meta.pass!==pass){ alert('비밀번호가 일치하지 않습니다.'); return false; }
  S.code=code; S.pass=pass; S.role=role; S.meta=meta;
  if(role==='student'){ S.team=Math.max(1,Math.min(meta.teamCount,parseInt(team)||1)); S.view='student';
    const c=db.ref('rooms/'+code+'/teams/'+tkey(S.team)+'/connected'); c.onDisconnect().set(false); c.set(true); }
  else if(role==='projector'){ S.view='projector'; }
  else if(role==='staff'){ const l=String(team||'').toUpperCase(); if(!meta.staffPin || String(pin||'')!==String(meta.staffPin) || !['A','B'].includes(l)){ alert('스태프 링크가 올바르지 않습니다. 선생님께 스태프 QR을 다시 받아 주세요.'); S.code=null; S.role=null; return false; } S.staff=l; S.view='staff'; }
  else { S.view='teacher'; }
  sessionStorage.setItem('cb_session', JSON.stringify({code,pass,role,team:role==='staff'?S.staff:S.team,pin:role==='staff'?pin:undefined}));
  subscribe(); return true;
}
function leave(){ S.subs.forEach(u=>u()); S.subs=[]; sessionStorage.removeItem('cb_session');
  Object.assign(S,{role:null,code:null,pass:null,team:null,staff:null,view:'home',meta:null,teams:{},pending:{},boxes:{},logs:[],events:[],teamLogs:[],event:null}); S.ui.randomTeams=null; render(); }

function subscribe(){
  S.subs.forEach(u=>u()); S.subs=[];
  const on=(ref,cb)=>{ const h=ref.on('value',s=>{cb(s);render();}); S.subs.push(()=>ref.off('value',h)); };
  on(roomRef('meta'), s=>{ S.meta=s.val(); if(!S.meta){ alert('교사가 방을 종료(삭제)했습니다.'); leave(); } });
  on(roomRef('teams'), s=>{ S.teams=s.val()||{}; });
  on(roomRef('pending'), s=>{ S.pending=s.val()||{}; });
  on(roomRef('boxes'), s=>{ S.boxes=s.val()||{}; });
  on(roomRef('event'), s=>{ S.event=s.val(); });
  on(roomRef('logs').limitToLast(80), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.logs=a.reverse(); });
  on(roomRef('events').limitToLast(40), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.events=a.reverse(); });
  if(S.role==='student') on(roomRef('teamLogs/'+tkey(S.team)).limitToLast(40), s=>{ const a=[]; s.forEach(c=>{a.push(c.val());}); S.teamLogs=a.reverse(); });
  render();
}

/* ---------- 학생 행동 ---------- */
async function mine(key){
  const ex=SOLO.find(e=>e.key===key)||PAIR.find(e=>e.key===key); if(!ex) return;
  if(mineBusy) return;
  if(evLive()){ flash('이벤트 중에는 운동 기록이 멈춰요!'); return; }
  if(T(S.team).quiz){ flash('건강 퀴즈를 먼저 풀어야 해요!'); return; }
  if(frozen(S.team)){ flash('자원 생산 정지 상태입니다!'); return; }
  if(cdLeft(S.team,key)){ flash(`이 운동은 ${cdLeft(S.team,key)}초 뒤에 다시!`); return; }
  if(teamCdLeft(S.team)){ flash(`${teamCdLeft(S.team)}초 뒤에 다시!`); return; }
  const solo=!!SOLO.find(e=>e.key===key);
  mineBusy=true; let r;
  try{
    r=await txTeam(S.team,t=>{ const n=now();
      if((t.freezeUntil||0)>n) return false;
      if(((t.cd||{})[key]||0)>n) return false;
      if((t.lastMine||0)+TEAM_COOLDOWN_SEC*1000>n) return false;
      if(t.quiz) return false;
      t.resource=(t.resource||0)+ex.value; t.cd=t.cd||{}; t.cd[key]=n+(ex.cd||20)*1000; t.lastMine=n;
      t.fit=t.fit||{}; (FIT[key]||[]).forEach(f=>{ t.fit[f]=(t.fit[f]||0)+1; });
      t.mineCount=(t.mineCount||0)+1; const qe=quizEvery(); if(qe>0 && t.mineCount%qe===0){ t.quiz={q:pickQuiz(t), at:n}; }
      if(solo){t.solo=t.solo||{};t.solo[key]=true;} else {t.pair=t.pair||{};t.pair[key]=true;} });
  } finally { mineBusy=false; }
  if(!r || !r.committed){ flash('잠시 후 다시 눌러 주세요!'); return; }
  const m=`자원 +${ex.value} · ${ex.label}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash(`+${ex.value}`);
}
async function buy(kind){
  if(evLive()){ flash('이벤트 중에는 잠시 멈춰요!'); return; }
  const price=PRICES[kind]; let ok=true;
  const r=await txTeam(S.team,t=>{ if((t.resource||0)<price){ok=false;return false;} t.resource-=price; if(kind==='attack') t.attack=(t.attack||0)+1; if(kind==='hp') t.hp=(t.hp==null?STARTING_HP:t.hp)+1; });
  if(!ok || !r.committed){ flash('자원이 부족합니다!'); return; }
  if(kind==='randombox'){ roomRef('pending').push({type:'randombox',team:S.team,ts:firebase.database.ServerValue.TIMESTAMP}); const m=`히든랜덤박스 사용 요청 -${price}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('요청 전송!'); return; }
  const m = kind==='attack' ? `상점 구매(공격권) -${price}` : `상점 구매(HP+1) -${price}`;
  log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('구매!');
}
function myPendingAttacks(){ return Object.values(S.pending).filter(p=>p.type==='attack'&&p.from===S.team).length; }
function canAttack(){ return (T(S.team).attack||0) - myPendingAttacks() > 0; }
function rollGame(to){
  if(evLive()){ flash('이벤트 중에는 잠시 멈춰요!'); return; }
  if(!canAttack()) return;
  const r=S.ui.rolls[to]||{count:0,game:null}; let n=r;
  if(r.count<3) n={count:r.count+1, game:MINIGAMES[Math.floor(Math.random()*MINIGAMES.length)]};
  S.ui.rolls[to]=n; S.ui.popupGame=n.game; S.ui.popupTarget=to; render();
}
function confirmAttack(){
  const to=S.ui.popupTarget, game=S.ui.popupGame; if(to==null||!game) return;
  const cd=S.ui.cooldown[to]||0; if(cd>now()){ flash('잠시 후 다시 공격할 수 있어요!'); return; }
  if(!canAttack()) return;
  roomRef('pending').push({type:'attack',from:S.team,to,game,ts:firebase.database.ServerValue.TIMESTAMP});
  S.ui.cooldown[to]=now()+3000; delete S.ui.rolls[to]; S.ui.popupGame=null; S.ui.popupTarget=null;
  const m=`팀 ${to} 공격 성공요청 · 미니게임: ${game}`; log(`팀 ${S.team}: ${m}`); tlog(S.team,m); flash('공격!');
}
async function answerQuiz(choice){
  const t=T(S.team); const qz=t.quiz; if(!qz) return;
  if((qz.lockUntil||0)>now()) return;
  const Q=QUIZ[qz.q]; if(!Q) { await txTeam(S.team,x=>{ x.quiz=null; }); return; }
  const ok = choice===Q.a;
  await txTeam(S.team,x=>{ if(!x.quiz || x.quiz.q!==qz.q) return false; x.quizSeen=x.quizSeen||{}; x.quizSeen[qz.q]=true;
    if(ok){ x.quizRight=(x.quizRight||0)+1; x.quiz=null; }
    else { x.quizWrong=(x.quizWrong||0)+1; x.quiz={q:pickQuiz(x), at:now(), lockUntil:now()+QUIZ_WRONG_WAIT*1000, prev:{q:qz.q}}; } });

const IC_NAME={sword:'공격권',shield:'방어권',mineral:'자원',heart:'HP',gift:'히든랜덤박스'};
function ic(n,size){ size=size||24; return `<svg class="ic" viewBox="0 0 48 48" width="${size}" height="${size}" role="img" aria-label="${IC_NAME[n]}">${ICONS[n]}</svg>`; }

function chips(t){ return `<div class="chips"><span class="chip c-atk" title="공격권">${ic('sword',28)}${t.attack||0}</span><span class="chip c-shd" title="방어권">${ic('shield',28)}${t.shield||0}</span><span class="chip c-res" title="자원">${ic('mineral',28)}${t.resource||0}</span></div>`; }
function mmss(sec){ return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function teamCard(i,size){ const t=T(i); const fz=frozen(i); const hp=hpOf(t); const dead=(t.hp!=null&&t.hp<=0);
  return `<div class="team-card ${dead?'hp0':''}"><div class="tc-head"><div class="tbadge s" style="background:${TEAM_COLORS[i-1]}">${i}</div><span class="jua">팀 ${i}</span><span class="dot ${t.connected?'on':''}" title="${t.connected?'접속 중':'미접속'}"></span></div><div class="tc-hp jua" style="color:${hp<=3?'#C2410C':'inherit'}">${ic('heart',32)}${hp}<small>HP</small></div>${hpBar(i)}${chips(t)}${fz?`<span class="badge b-red">생산 정지 ${mmss(fz)}</span>`:''}${t.quiz?'<span class="badge b-pur">건강 퀴즈 푸는 중</span>':''}${t.fairplay?`<span class="badge b-green">페어플레이 ${t.fairplay}</span>`:''}</div>`; }

function quizCard(t){

  return `<div class="quiz" role="region" aria-label="건강 퀴즈"><div class="qh">${ic('heart',28)} 건강 퀴즈 타임!</div>

    <div class="qq">Q. ${esc(Q.q)}</div>
    <div class="qo">${Q.o.map((o,k)=>`<button data-a="quiz" data-k="${k}" ${lock?'disabled':''}>${k+1}. ${esc(o)}</button>`).join('')}</div>

}

    <div class="grid" style="grid-template-columns:1fr 2fr"><input placeholder="이벤트 이름 (예: 버피 챌린지)" data-in="evTitle" value="${esc(S.ui.evTitle)}"><input placeholder="할 일 설명 (예: 30초 동안 팀 전원 버피!)" data-in="evDesc" value="${esc(S.ui.evDesc)}"></div>
    <div class="row" style="margin-top:8px"><button class="btn-purple" data-a="evNow">지금 시작</button><button data-a="evLater">${EVENT_DELAY_MIN}분 뒤 시작</button></div>${rewards}</div>`;
  if(ev.status==='scheduled') return `<div class="card"><h2>${ic('gift',28)} 이벤트 예약됨: ${esc(ev.title)}</h2><div class="jua" style="font-size:30px">${mmss(evSoon())} 뒤 자동 시작</div><div class="row" style="margin-top:8px"><button class="btn-purple" data-a="evGo">지금 바로 시작</button><button data-a="evCancel">예약 취소</button></div></div>`;
  const order=S.ui.evOrder||[]; const left=teamIdx().filter(i=>!order.includes(i));
  return `<div class="card" style="box-shadow:inset 0 0 0 4px #8A63C9"><h2>${ic('gift',28)} 이벤트 진행 중: ${esc(ev.title)}</h2>${ev.desc?`<div>${esc(ev.desc)}</div>`:''}
    <h3>순위 입력: 1위 팀부터 차례로 누르세요</h3>
    <div class="rank-pick">${left.map(i=>`<button class="lg" style="border-color:${TEAM_COLORS[i-1]};color:${TEAM_INK[i-1]}" data-a="evRank" data-i="${i}">팀 ${i}</button>`).join('')||'<span class="muted">모든 팀 순위 입력 완료</span>'}</div>
    <div class="row">${order.map((i,k)=>`<span class="badge" style="background:${TEAM_BG[i-1]};color:${TEAM_INK[i-1]}">${k+1}위 팀 ${i} · ${EVENT_REWARDS[Math.min(k,3)]}</span>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn-green" data-a="evFinish" ${order.length<teamCount()?'disabled':''}>보상 지급하고 이벤트 끝내기</button><button class="sm" data-a="evUndo" ${order.length?'':'disabled'}>순위 하나 지우기</button><button class="sm btn-red" data-a="evCancel">이벤트 취소</button></div>
    <div class="muted" style="margin-top:6px">1위의 히든랜덤박스는 승인 패널로 들어가요 (스태프·교사가 승인하면 열려요).</div></div>`;
}
function renderTeacher(){
  const m=S.meta||{}; const ct=S.ui.controlTeam; const t=T(ct); const fz=frozen(ct);
  const sel=(name,val,skipA)=>`<select data-in="${name}">${teamIdx().map(i=>`<option value="${i}" ${val==i?'selected':''}>팀 ${i}</option>`).join('')}</select>`;
  const tb=(f,d)=>`<button data-a="adjust" data-f="${f}" data-d="${d}">${d>0?'+':'−'}${Math.abs(d)===1?'':Math.abs(d)}</button>`;
  return `<div class="card"><div class="row" style="justify-content:space-between">
    <div><h2 style="margin:0">교사용 대시보드</h2><div class="muted">${m.status==='ended'?'<span class="badge b-red">종료됨</span>':'<span class="badge b-green">진행 중</span>'}</div></div>
    <div class="row"><button class="btn-yellow sm" data-a="lock">${m.lock===false?'🔓 잠금 해제 (학생: 팀 선택 가능)':'🔒 잠금 (학생: 자기 팀만)'}</button><button class="sm btn-green" data-a="endSave" ${S.ui.saving?'disabled':''}>${S.ui.saving?'저장 중…':'🏁 게임 종료 & 결과 저장'}</button><button class="sm" data-a="dl">로그 저장</button><button class="sm" data-a="reset">초기화</button><button class="sm btn-red" data-a="delete">방 삭제</button></div></div></div>
  ${eventCard()}
  <div class="card"><details ${S.ui.qrOpen?'open':''}><summary>📱 접속 QR코드 / 링크 <span class="muted">(학생 태블릿 카메라로 찍으면 바로 자기 팀으로 들어옵니다)</span> <span class="roomkey">방 코드 <b>${S.code}</b> · 비밀번호 <b>${esc(S.pass)}</b></span></summary>
    <div class="qrwrap">${teamIdx().map(i=>`<div class="qrbox"><b style="color:${TEAM_COLORS[i-1]}">팀 ${i}</b><div class="qr" data-url="${esc(teamUrl(i))}"></div><button class="sm" data-a="copy" data-url="${esc(teamUrl(i))}">링크 복사</button></div>`).join('')}<div class="qrbox"><b>관전자(프로젝터)</b><div class="qr" data-url="${esc(projUrl())}"></div><button class="sm" data-a="copy" data-url="${esc(projUrl())}">링크 복사</button></div>${m.staffPin?['A','B'].map(l=>`<div class="qrbox" style="background:#E3F1E4"><b style="color:#2F6B3A">스태프 ${l} (${staffTeams(l).map(i=>'팀 '+i).join(', ')})</b><div class="qr" data-url="${esc(staffUrl(l))}"></div><button class="sm" data-a="copy" data-url="${esc(staffUrl(l))}">링크 복사</button></div>`).join(''):`<div class="qrbox"><b>스태프</b><button class="sm btn-green" data-a="makePin">스태프 QR 만들기</button></div>`}</div>
    ${location.protocol==='file:'?'<div class="warn" style="margin-top:8px">지금은 파일을 직접 연 상태라 QR이 다른 기기에서 열리지 않습니다. 인터넷에 올린 주소로 열어야 QR이 작동합니다.</div>':''}</details></div>
  ${requestPanel()}
  <div class="grid" style="grid-template-columns:repeat(${Math.min(teamCount(),3)},1fr)">${teamIdx().map(i=>teamCard(i)).join('')}</div>
  <div class="card" style="margin-top:12px"><h2>교사 전용 자원 / 능력 조정</h2>
    <div class="row" style="margin-bottom:8px"><span class="muted">대상 팀:</span>${teamIdx().map(i=>`<button class="sm ${ct===i?'btn-blue':''}" data-a="ctrl" data-i="${i}">팀 ${i}</button>`).join('')}</div>
    <div class="tiles">
      <div class="tile t-res"><div class="nm">${ic('mineral',26)} 자원</div><div class="n">${t.resource||0}</div><div class="bt">${tb('resource',-5)}${tb('resource',-1)}${tb('resource',1)}${tb('resource',5)}</div></div>
      <div class="tile t-atk"><div class="nm">${ic('sword',26)} 공격권</div><div class="n">${t.attack||0}</div><div class="bt">${tb('attack',-1)}${tb('attack',1)}</div></div>
      <div class="tile t-shd"><div class="nm">${ic('shield',26)} 방어권</div><div class="n">${t.shield||0}</div><div class="bt">${tb('shield',-1)}${tb('shield',1)}</div></div>
      <div class="tile t-hp"><div class="nm">${ic('heart',26)} HP</div><div class="n">${t.hp==null?STARTING_HP:t.hp}</div><div class="bt">${tb('hp',-1)}${tb('hp',1)}</div></div>
    </div>
    <div style="margin-top:10px">${fairplayBox(teamIdx())}</div>
    <div class="info" style="margin-top:8px"><b>건강 퀴즈 관문</b> <span class="muted">운동 기록 몇 번마다 퀴즈를 낼까요? (보조 학생이 풀어야 운동 재개)</span><div class="row" style="margin-top:6px">${[0,5,8,12].map(v=>`<button class="sm ${quizEvery()===v?'btn-purple':''}" data-a="quizEvery" data-k="${v}">${v?v+'번마다':'끄기'}</button>`).join('')}</div></div>
    <div class="muted" style="margin-top:6px">팀 ${ct} · 공격 성공 ${t.attackSuccess||0}회 · 전체 채굴 ${t.allClearCount||0}회${fz?` · <span style="color:#b91c1c">자원생산 정지 (${Math.ceil(fz/60)}분 남음)</span>`:''}</div>
    <div class="cols" style="margin-top:10px">
      <div class="info"><b>✨ AMAZING: 자원 바꾸기</b><div class="row" style="margin-top:4px">${sel('swapA',S.ui.swapA)} ↔ ${sel('swapB',S.ui.swapB)} <button class="sm btn-purple" data-a="swap">자원 바꾸기</button></div></div>
      <div class="info"><b>⏱️ UNBELIEVABLE: 자원생산 3분 정지</b><div class="row" style="margin-top:4px">${sel('freezeT',S.ui.freezeT)} <button class="sm btn-red" data-a="freeze">정지(3분)</button> <button class="sm" data-a="unfreeze" ${frozen(parseInt(S.ui.freezeT))?'':'disabled'}>정지 해제</button></div></div>
    </div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🔀 랜덤 팀 편성</h2><span class="row"><input type="number" min="1" max="60" style="width:80px" data-in="students" value="${S.ui.students}" title="학생 수"> 명 중 NPC <input type="number" min="0" max="30" style="width:70px" data-in="npc" value="${S.ui.npc}"> 명 <button class="btn-dark sm" data-a="shuffle">섞기</button></span></div>
    <div class="muted">학생 번호를 무작위로 섞어 NPC를 먼저 뽑고, 나머지를 ${teamCount()}개 팀에 고르게 나눕니다.</div>
    ${S.ui.randomTeams?`<div class="grid gauto" style="margin-top:8px">${S.ui.randomTeams.teams.map((arr,k)=>`<div class="info" style="border-color:${TEAM_COLORS[k]}"><b style="color:${TEAM_COLORS[k]}">팀 ${k+1}</b> (${arr.length}명)<br>${arr.join(', ')||'—'}</div>`).join('')}<div class="info"><b>NPC</b> (${S.ui.randomTeams.npc.length}명)<br>${S.ui.randomTeams.npc.join(', ')||'—'}</div></div>`:''}</div>
  <div class="cols"><div class="card"><h2>전체 로그</h2>${logBox(S.logs)}${boxLegend()}</div><div class="card"><h2>전투 소식</h2>${newsBox(S.events,10)}</div></div>`;
}

function render(){
  try{ document.documentElement.style.setProperty('--ph', (-(performance.now()/1000)).toFixed(3)+'s'); document.body.classList.toggle('still', !!S.ui.still); }catch(_){}
  let body='';
  if(S.view==='home') body=renderHome();
  else if(S.view==='student') body=renderStudent();
  else if(S.view==='projector') body=renderProjector();
  else if(S.view==='teacher') body=renderTeacher();
  else if(S.view==='staff') body=renderStaff();
  const active=document.activeElement; const keep = active && active.dataset && active.dataset.in ? {name:active.dataset.in, pos:active.selectionStart} : null;
  $('#app').innerHTML = topbar()+body+modal()+(S.flash?`<div class="flash">${esc(S.flash)}</div>`:'');
  if(keep){ const el=document.querySelector(`[data-in="${keep.name}"]`); if(el){ el.focus(); try{ el.setSelectionRange(keep.pos,keep.pos);}catch(_){} } }
  document.querySelectorAll('.qr').forEach(el=>{ if(!el.dataset.done){ el.dataset.done='1'; try{ new QRCode(el,{text:el.dataset.url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent='QR 생성 실패'; } } });
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, d=el.dataset;
  try{
    switch(a){
      case 'createRoom': await createRoom(); break;
      case 'joinStudent': await joinRoom(S.ui.joinCode,S.ui.joinPass,'student',S.ui.joinTeam); break;
      case 'joinProjector': await joinRoom(S.ui.joinCode,S.ui.joinPass,'projector'); break;
      case 'joinTeacher': if(prompt('교사 비밀번호')!==CONFIG.teacherPassword){ alert('비밀번호가 올바르지 않습니다.'); break; } await joinRoom(S.ui.joinCode,S.ui.joinPass,'teacher'); break;
      case 'fullscreen': toggleFullscreen(); break;
      case 'still': S.ui.still=!S.ui.still; try{ localStorage.setItem('cb_still', S.ui.still?'1':''); }catch(_){} render(); break;
      case 'leave': if(S.role!=='teacher' || confirm('교사 화면에서 나갈까요? (방은 유지되며, 방 코드와 비밀번호로 다시 들어올 수 있습니다)')) leave(); break;
      case 'view': if(d.v==='teacher' && S.role!=='teacher' && prompt('교사 비밀번호')!==CONFIG.teacherPassword){ alert('비밀번호가 올바르지 않습니다.'); break; } S.view=d.v; render(); break;
      case 'mine': await mine(d.k); break;
      case 'buy': await buy(d.k); break;
      case 'attack': rollGame(parseInt(d.i)); break;
      case 'reroll': rollGame(parseInt(d.i)); break;
      case 'confirmAttack': confirmAttack(); break;
      case 'cancelPopup': S.ui.popupGame=null; S.ui.popupTarget=null; render(); break;
      case 'allclear': requestAllClear(); break;
      case 'dismissBox': S.ui.dismissedBox=Number(d.ts); roomRef('boxes/'+tkey(S.team)).remove(); render(); break;
      case 'switchTeam': { const k=parseInt(d.i); roomRef('teams/'+tkey(S.team)+'/connected').set(false); S.team=k; const c=roomRef('teams/'+tkey(k)+'/connected'); c.onDisconnect().set(false); c.set(true); subscribe(); break; }
      case 'toggle': S.ui[d.k]=!S.ui[d.k]; render(); break;
      case 'filter': S.ui.pendingFilter=d.k; render(); break;
      case 'approve': await approve(d.id); break;
      case 'cancel': await cancel(d.id); break;
      case 'fail': await failAttack(d.id); break;
      case 'quiz': await answerQuiz(parseInt(d.k)); break;
      case 'fpReason': S.ui.fpReason=d.k; render(); break;
      case 'fairplay': await fairplay(parseInt(d.i), S.ui.fpReason||FAIRPLAY_REASONS[0]); break;
      case 'quizEvery': await roomRef('meta/quizEvery').set(parseInt(d.k)); flash(parseInt(d.k)?`운동 ${d.k}번마다 퀴즈`:'퀴즈 끄기'); break;
      case 'makePin': await roomRef('meta/staffPin').set(String(Math.floor(1000+Math.random()*9000))); break;
      case 'evPreset': { const pr=EVENT_PRESETS[parseInt(d.k)]; S.ui.evTitle=pr.title; S.ui.evDesc=pr.desc; render(); break; }
      case 'evNow': await startEvent(0); break;
      case 'evLater': await startEvent(EVENT_DELAY_MIN); break;
      case 'evGo': await goLive(); break;
      case 'evCancel': await cancelEvent(); break;
      case 'evRank': { const i=parseInt(d.i); S.ui.evOrder=(S.ui.evOrder||[]).filter(x=>x!==i).concat([i]); render(); break; }
      case 'evUndo': S.ui.evOrder=(S.ui.evOrder||[]).slice(0,-1); render(); break;
      case 'evFinish': await finishEvent(); break;
      case 'ctrl': S.ui.controlTeam=parseInt(d.i); render(); break;
      case 'adjust': await adjust(S.ui.controlTeam,d.f,parseInt(d.d)); break;
      case 'swap': await swapResources(parseInt(S.ui.swapA),parseInt(S.ui.swapB)); break;
      case 'freeze': await freezeTeam(parseInt(S.ui.freezeT)); break;
      case 'unfreeze': await unfreezeTeam(parseInt(S.ui.freezeT)); break;
      case 'modalPick': { const m=S.ui.teacherModal; S.ui.teacherModal=null; if(m.type==='swap') await swapResources(m.team,parseInt(d.i)); else await freezeTeam(parseInt(d.i)); render(); break; }
      case 'modalClose': S.ui.teacherModal=null; render(); break;
      case 'lock': toggleLock(); break;
      case 'shuffle': shuffleTeams(); break;
      case 'reset': await resetRoom(); break;
      case 'delete': await deleteRoom(); break;
      case 'endSave': await endAndSave(); break;
      case 'dl': downloadLogs(); break;
      case 'copy': try{ await navigator.clipboard.writeText(d.url); flash('복사됨'); }catch(_){ prompt('링크를 복사하세요', d.url); } break;
    }
  }catch(err){ console.warn(err); showErr(err.message||String(err)); }
});
document.addEventListener('input', e=>{ const el=e.target; if(el.dataset && el.dataset.in){ S.ui[el.dataset.in]=el.value; } });
document.addEventListener('change', e=>{ const el=e.target; if(el.dataset && el.dataset.in && el.tagName==='SELECT'){ S.ui[el.dataset.in]=el.value; render(); } });
document.addEventListener('toggle', e=>{ if(e.target.tagName==='DETAILS'){ const s=e.target.querySelector('summary'); if(s && s.textContent.includes('QR')) S.ui.qrOpen=e.target.open; if(s && s.textContent.includes('교사 메뉴')) S.ui.teacherOpen=e.target.open; } }, true);
setInterval(()=>{
  if(!S.role) return;
  const ev=S.event;
  if(ev && ev.status==='scheduled'){ if(now()>=(ev.startAt||0) && S.role!=='student') goLive(); render(); return; }
  const qz = S.role==='student' && S.team && T(S.team).quiz;
  if(teamIdx().some(i=>frozen(i) || (S.role==='student' && i===S.team && anyCd(i))) || (qz && (qz.lockUntil||0)>now()-1000)) render();
}, 1000);

/* ---------- 시작: URL 파라미터 / 세션 복구 ---------- */
(async function init(){
  render();
  const p=new URLSearchParams(location.search);
  if(p.get('room')){
    const code=p.get('room'), pass=p.get('pass')||'';
    if(p.get('view')==='projector') await joinRoom(code,pass,'projector');
    else if(p.get('staff')) await joinRoom(code,pass,'staff',p.get('staff'),p.get('pin'));
    else if(p.get('team')) await joinRoom(code,pass,'student',p.get('team'));
    else { S.ui.joinCode=code; S.ui.joinPass=pass; render(); }
    return;
  }
  try{ const s=JSON.parse(sessionStorage.getItem('cb_session')||'null'); if(s && s.code){ await joinRoom(s.code,s.pass,s.role,s.team,s.pin); } }catch(_){}
})();
</script>
</body>
</html>
